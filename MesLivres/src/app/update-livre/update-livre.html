<div class="container mt-4">
  <div class="card shadow mb-4">
    <div class="card-header py-3">
      <h5 class="m-0 font-weight-bold text-primary">Modifier un Livre :</h5>
    </div>
    <div class="card-body">
      <form>
        <div class="row">
          <div class="col-sm-2 col-md-2 mb-3">
            <label class="form-label">ID Livre</label>
            <input readonly type="number" [(ngModel)]="currentLivre.idLivre" name="idLivre"
              class="form-control bg-light" />
          </div>
          <div class="col-sm-6 col-md-6 mb-3">
            <label class="form-label">Titre du Livre</label>
            <input type="text" [(ngModel)]="currentLivre.titreLivre" name="titreLivre" class="form-control" />
          </div>
          <div class="col-sm-4 col-md-4 mb-3">
            <label class="form-label">Nombre de Pages</label>
            <input type="number" [(ngModel)]="currentLivre.nombrePages" name="nombrePages" class="form-control" />
          </div>
        </div>

        <div class="row">
          <div class="col-sm-3 col-md-3 mb-3">
            <label class="form-label">Prix (DT)</label>
            <input type="number" step="0.001" [(ngModel)]="currentLivre.prix" name="prix" class="form-control" />
          </div>
          <div class="col-sm-4 col-md-4 mb-3">
            <label class="form-label">Date de Publication</label>
            <input type="date" [ngModel]="currentLivre.datePublication | date: 'yyyy-MM-dd'"
              (ngModelChange)="currentLivre.datePublication = $event" name="datePublication" class="form-control" />
          </div>
          <div class="col-sm-5 col-md-5 mb-3">
            <label class="form-label">Écrivain</label>
            <select class="form-select" id="idEcrivain" name="idEcrivain" [(ngModel)]="updatedEcrivainId">
              @for (ecriv of ecrivains; track ecriv.idEcrivain) {
              <option [value]="ecriv.idEcrivain">
                {{ ecriv.prenomEcrivain }} {{ ecriv.nomEcrivain }}
              </option>
              }
            </select>
          </div>
        </div>

        <div class="mt-2">
          <button type="button" (click)="updateLivre()" class="btn btn-success">
            Modifier
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
